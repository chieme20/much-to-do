version: '3.8'

services:

  backend:
    build: .
    image: much-todo-backend:latest
    ports:
      - "8080:8080"
    environment:
      - MONGO_URL=mongodb://db:27017/much-todo
    depends_on:
      - db
    restart: always

  db:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data: