apiVersion: apps/v1
kind: Deployment
metadata:
  name: much-todo-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: much-todo
  template:
    metadata:
      labels:
        app: much-todo
    spec:
      containers:
      - name: backend
        image: much-todo-backend:latest
        imagePullPolicy: Never 
        ports:
        - containerPort: 8080
        env:
        - name: MONGO_URL
          value: "mongodb://mongodb-service:27017/much-todo"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:latest
        imagePullPolicy: Never  
        ports:
        - containerPort: 27017
